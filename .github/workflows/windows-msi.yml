name: Windows x64 MSI

on:
  push:
    branches: [atlas]
    tags: ["atlas-*"]
  pull_request:
    branches: [atlas]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-msi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-msi:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Typecheck and frontend tests
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:unit --maxWorkers=4 --minWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build:renderer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rust tests with isolated app data
        run: |
          $atlasTestHome = Join-Path $env:RUNNER_TEMP 'atlas-test-home'
          $atlasTestData = Join-Path $atlasTestHome '.cc-switch'
          New-Item -ItemType Directory -Path $atlasTestData -Force | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $atlasTestData 'cc-switch.db'), [byte[]]@())
          $env:CC_SWITCH_TEST_HOME = $atlasTestHome
          cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build MSI
        run: ./scripts/build-msi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CC-Switch-atlas-Windows-x64
          path: |
            release/*.msi
            release/*.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/atlas-')
    needs: windows-msi
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: CC-Switch-atlas-Windows-x64
          path: release
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ATLAS_TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:ATLAS_TAG --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $env:ATLAS_TAG already exists; keeping its published assets."
            exit 0
          }
          $assets = (Get-ChildItem -LiteralPath release -File).FullName
          gh release create $env:ATLAS_TAG @assets --verify-tag --title "CC Switch $env:ATLAS_TAG" --notes-file RELEASE.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
